 <hr style="width:70%;">
    <br>
    <br>
    <form id="bookingForm">
<label for="name">Parent Name:</label><br>
<input type="text" id="name" name="name"><br><br>

<label for="gmail">Gmail:</label><br>
<input type="email" id="gmail" name="gmail"><br><br>

<label for="phonenumber">Phone Number:</label><br>
<input type="tel" id="phonenumber" name="phonenumber"><br><br>



<label for="partyDate">Party Date:</label><br>
<input type="text" id="partyDate" name="partyDate" required>
<script>
minDate: "today"
</script>
<br>
<br>
<label for="partyTime">Start Time:</label><br>
<input type="time" id="startTime" name="startTime">
    <br><br>
<label for="partyTime">End Time:</label><br>
<input type="time" id="endTime" name="endTime">
<br><br>
<label for="partyPlace">Exact Location:</label><br>
<input type="place" id="partyPlace" name="partyPlace">
<br><br>
<label for="partyNumber">Number of people:</label><br>
<input type="number" id="partyNumber" name="partyNumber">
<br><br>
<button class="clearButton" type="reset">Clear All</button><br><br>

<button type="submit" class="button">
    Submit
</button>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxS6FCiwPaUq1KIjd0yMtzH6IiKLMTSuNvK_8Nbp9Pia7EhfwH2zktMUBMkKtdkxaW6/exec";

// Load booked dates and initialize the calendar
fetch(WEB_APP_URL)
  .then(response => response.json())
  .then(bookedDates => {

    flatpickr("#partyDate", {
      dateFormat: "Y-m-d",
      minDate: "today",
      disable: bookedDates,
      disableMobile: true
    });

  })
  .catch(error => {
    console.log("Unable to load booked dates:", error);

    // Still show the calendar even if booked dates can't be loaded
    flatpickr("#partyDate", {
      dateFormat: "Y-m-d",
      minDate: "today",
      disableMobile: true
    });
  });

// Submit the form
document.getElementById("bookingForm").addEventListener("submit", function(e){

    e.preventDefault();



// Validate required fields
if (!document.getElementById("name").value.trim()) {
    alert("Please enter the parent's name.");
    return;
}

if (!document.getElementById("gmail").value.trim()) {
    alert("Please enter an email address.");
    return;
}

if (!document.getElementById("phonenumber").value.trim()) {
    alert("Please enter a phone number.");
    return;
}

if (!document.getElementById("partyDate").value) {
    alert("Please select a party date.");
    return;
}

if (!document.getElementById("startTime").value) {
    alert("Please select a start time.");
    return;
}

if (!document.getElementById("endTime").value) {
    alert("Please select an end time.");
    return;
}


// Require location
if (!document.getElementById("partyPlace").value.trim()) {
    alert("Please enter the party location.");
    return;
}

// Require at least 1 guest
const guests = Number(document.getElementById("partyNumber").value);

if (guests < 1) {
    alert("Please enter at least 1 guest.");
    return;
}

// Time validation
const start = document.getElementById("startTime").value;
const end = document.getElementById("endTime").value;

// Earliest booking is 8:00 AM
if (start < "08:00") {
    alert("Bookings cannot start before 8:00 AM.");
    return;
}

// End must be after start
if (end <= start) {
    alert("End time must be later than the start time.");
    return;
}

// Minimum booking length = 1 hour
const startMinutes =
    Number(start.split(":")[0]) * 60 +
    Number(start.split(":")[1]);

const endMinutes =
    Number(end.split(":")[0]) * 60 +
    Number(end.split(":")[1]);

if (endMinutes - startMinutes < 60) {
    alert("Parties must be at least 1 hour long.");
    return;
}


    const booking = {
        parent: document.getElementById("name").value,
        email: document.getElementById("gmail").value,
        phone: document.getElementById("phonenumber").value,
        date: document.getElementById("partyDate").value,
        start: document.getElementById("startTime").value,
        end: document.getElementById("endTime").value,
        location: document.getElementById("partyPlace").value,
        guests: guests
    };

    fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(booking)
    })
    .then(response => response.text())
    .then(result => {

        if(result === "Success"){
            window.location.href = "success.html";
        } else {
            alert("Something went wrong. Please try again.");
        }

    })
    .catch(error => {
        alert("Unable to submit booking.");
        console.log(error);
    });

});

</script>
